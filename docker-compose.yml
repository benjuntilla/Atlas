# Local Atlas dev environment.
#
# Phase 1 brings up infrastructure only (Postgres + Kafka). Service stanzas
# below are commented out and get uncommented as each phase lands:
#   Phase 2 -> auth-service
#   Phase 3 -> geo-engine
#   Phase 4 -> payments-service
#   Phase 5 -> gateway
#   Phase 6 -> consumers
#   Phase 7 -> control-plane
#
# Usage:
#   docker compose up -d postgres kafka      # Phase 1
#   docker compose logs -f postgres          # tail migrations applying
#   psql postgres://atlas:atlas_dev@localhost:5432/atlas -c '\dn'

services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      # Files in /docker-entrypoint-initdb.d run in lexical order on first
      # boot only. The 00xx_ prefix on each migration controls ordering.
      - ./migrations:/docker-entrypoint-initdb.d:ro
      - atlas_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # --- Phase 2: auth-service (Kotlin/gRPC) ----------------------------------
  auth-service:
    build:
      # Build context is the repo root so the Dockerfile can pull files from
      # both /proto and /services/auth-service. Phase 2A's commented stanza
      # used `./services/auth-service` as context which would not have worked
      # once the protobuf-gradle-plugin started reading from $rootDir/proto.
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports: ["50051:50051"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
    environment:
      DATABASE_URL: postgres://atlas:atlas_dev@postgres:5432/atlas
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: dev_secret_change_in_prod_dev_secret_change_in_prod
      GRPC_PORT: "50051"

  # --- Phase 3: geo-engine (Rust) -------------------------------------------
  # geo-engine:
  #   build: ./services/geo-engine
  #   ports: ["50052:50052"]
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     kafka: { condition: service_started }
  #   environment:
  #     DATABASE_URL: postgres://atlas:atlas_dev@postgres:5432/atlas
  #     KAFKA_BROKERS: kafka:29092

  # --- Phase 4: payments-service (Kotlin/Ktor) ------------------------------
  # payments-service:
  #   build: ./services/payments-service
  #   ports: ["50053:50053"]
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     kafka: { condition: service_started }
  #   environment:
  #     DATABASE_URL: postgres://atlas:atlas_dev@postgres:5432/atlas
  #     KAFKA_BROKERS: kafka:29092

  # --- Phase 5: gateway (Rust/Axum) -----------------------------------------
  # gateway:
  #   build: ./services/gateway
  #   ports: ["8080:8080"]
  #   depends_on: [auth-service, geo-engine, payments-service]
  #   environment:
  #     AUTH_SERVICE_ADDR: http://auth-service:50051
  #     GEO_ENGINE_ADDR: http://geo-engine:50052
  #     PAYMENTS_SERVICE_ADDR: http://payments-service:50053
  #     HAGGLE_SERVICE_ADDR: http://haggle:50055

  # --- Phase 7: control-plane (Rust/Axum) -----------------------------------
  # Backend the developer CLI and dashboard talk to: signup, project
  # provisioning, API keys, usage stats, log streaming.
  # control-plane:
  #   build: ./services/control-plane
  #   ports: ["8081:8081"]
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     kafka: { condition: service_started }
  #   environment:
  #     DATABASE_URL: postgres://atlas:atlas_dev@postgres:5432/atlas
  #     KAFKA_BROKERS: kafka:29092

volumes:
  atlas_pg_data:
