# Workspace root for all Rust services and consumers in Atlas.
#
# Member crates are added as each phase lands. Phase 1 ships the workspace
# definition with no members yet so `cargo` commands run cleanly at the root.

[workspace]
resolver = "2"
members = [
    # Phase 0 — platform developer surface
    "cli",
    # Phase 3
    "services/geo-engine",
    # Phase 5
    "services/gateway",
    # Phase 6
    # "consumers/location-consumer",
    # "consumers/safety-consumer",
    # Phase 7
    # "services/control-plane",
]

# Shared dependency versions. Member crates inherit via `workspace = true`.
[workspace.dependencies]
axum = "0.7"
tonic = "0.11"
tonic-build = "0.11"
tonic-health = "0.11"
prost-build = "0.12"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "macros"] }
rdkafka = { version = "0.36", features = ["tokio"] }
prost = "0.12"
prost-types = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.22"
metrics-exporter-prometheus = "0.13"
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
owo-colors = "4"

[profile.release]
lto = "thin"
codegen-units = 1
