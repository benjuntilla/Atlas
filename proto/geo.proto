syntax = "proto3";

package atlas.geo;

service GeoEngine {
  rpc UpdateLocation(LocationUpdate) returns (LocationAck);
  rpc GetNearby(NearbyRequest) returns (NearbyResponse);
  rpc ScoreRoute(RouteScoreRequest) returns (RouteScoreResponse);
  rpc TriggerGeofenceCheck(GeofenceCheckRequest) returns (GeofenceCheckResponse);

  // Phase 3: developer-facing geofence CRUD. Geofences are owned by a
  // user_id; what the developer does with them (alerting, gating routes,
  // pickup zones, etc.) is the developer's choice.
  rpc CreateGeofence(CreateGeofenceRequest) returns (Geofence);
  rpc ListGeofences(ListGeofencesRequest) returns (ListGeofencesResponse);
  rpc DeleteGeofence(DeleteGeofenceRequest) returns (DeleteGeofenceResponse);
}

message LocationUpdate {
  string user_id = 1;
  double lat = 2;
  double lng = 3;
  int64  recorded_at = 4;
}

message LocationAck { bool ok = 1; }

message NearbyRequest {
  string requester_user_id = 1;
  double lat = 2;
  double lng = 3;
  double radius_m = 4;
  string role = 5; // "driver" | "walker"
  // 0 means default 20, max 100. Enforced in the service layer.
  uint32 limit = 6;
}

message NearbyUser {
  string user_id = 1;
  double lat = 2;
  double lng = 3;
  double distance_m = 4;
  double safety_score = 5;
}

message NearbyResponse { repeated NearbyUser users = 1; }

message RouteScoreRequest {
  string user_id = 1;
  repeated RouteCandidate candidates = 2;
}

message RouteCandidate {
  string route_id = 1;
  repeated LatLng points = 2;
}

message LatLng { double lat = 1; double lng = 2; }

message RouteScoreResponse {
  string best_route_id = 1;
  double score = 2;
  repeated ScoredRoute all_scores = 3;
}

message ScoredRoute {
  string route_id = 1;
  double score = 2;
}

message GeofenceCheckRequest {
  string user_id = 1;
  double lat = 2;
  double lng = 3;
}

message GeofenceCheckResponse {
  bool triggered = 1;
  repeated string geofence_ids = 2;
}

// --- Geofence CRUD (Phase 3) ------------------------------------------------

message Geofence {
  string id = 1;
  string user_id = 2;
  string label = 3;       // empty string means no label
  double center_lat = 4;
  double center_lng = 5;
  double radius_m = 6;
  bool   active = 7;
  int64  created_at = 8;  // unix epoch seconds
}

message CreateGeofenceRequest {
  string user_id = 1;
  string label = 2;       // empty string = NULL in DB
  double center_lat = 3;
  double center_lng = 4;
  double radius_m = 5;
}

message ListGeofencesRequest {
  string user_id = 1;
  bool active_only = 2;
}

message ListGeofencesResponse {
  repeated Geofence geofences = 1;
}

message DeleteGeofenceRequest {
  string geofence_id = 1;
}

message DeleteGeofenceResponse {
  bool deleted = 1;
}
