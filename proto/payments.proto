syntax = "proto3";

package atlas.payments;

option java_multiple_files = true;
option java_package = "atlas.payments";

service PaymentsService {
  // Add funds to a wallet from an external payment method. This is the only
  // way money enters the platform: wallets start at zero and settlement
  // refuses to move funds a wallet does not hold.
  rpc Deposit(DepositRequest) returns (DepositResponse);

  rpc InitiateTransaction(TransactionRequest) returns (TransactionResponse);
  rpc SettleTransaction(SettleRequest) returns (SettleResponse);
  rpc GetWalletBalance(WalletRequest) returns (WalletResponse);
  rpc RefundTransaction(RefundRequest) returns (RefundResponse);

  // Internal: forces an immediate outbox drain pass and returns the number of
  // rows dispatched. The dispatcher also runs on a timer; this is for tests
  // and ops that want a deterministic flush. Not exposed through the gateway.
  rpc DrainOutbox(DrainOutboxRequest) returns (DrainOutboxResponse);
}

message DepositRequest {
  string user_id         = 1;
  int64  amount_cents    = 2;
  string idempotency_key = 3;
}

message DepositResponse {
  string transaction_id = 1;
  string status         = 2;
  // Wallet balance after the deposit, so the caller does not need a second
  // round trip to render the result.
  int64  balance_cents  = 3;
}

message TransactionRequest {
  string from_user_id   = 1;
  string to_user_id     = 2;
  int64  amount_cents   = 3;
  string idempotency_key = 4;
  string ride_id        = 5;
}

message TransactionResponse {
  string transaction_id = 1;
  string status = 2;
}

message SettleRequest  { string transaction_id = 1; }
message SettleResponse { bool success = 1; string status = 2; }

message WalletRequest  { string user_id = 1; }
message WalletResponse { int64 balance_cents = 1; string currency = 2; }

message RefundRequest  { string transaction_id = 1; }
message RefundResponse { bool success = 1; }

message DrainOutboxRequest  { uint32 max_rows = 1; }   // 0 => default 100
message DrainOutboxResponse { uint32 rows_dispatched = 1; }
