# TEMPLATE ONLY — deliberately excluded from kustomization.yaml so that
# `kubectl apply -k` can never create it.
#
# These are placeholder values. Do not fill them in and commit the result.
# Supply the real ones through a secret manager: on GKE, Secret Manager via
# the Secrets Store CSI driver, or External Secrets Operator syncing into a
# Secret with this exact name and these keys.
#
# To create it by hand for a scratch cluster:
#
#   kubectl -n atlas create secret generic atlas-secrets \
#     --from-literal=database-url='postgres://user:pass@host:5432/atlas' \
#     --from-literal=jwt-secret="$(openssl rand -base64 48)" \
#     --from-literal=jwt-key-id="k1"
#
apiVersion: v1
kind: Secret
metadata:
  name: atlas-secrets
  namespace: atlas
type: Opaque
stringData:
  # Full DSN. Every service that touches Postgres reads this.
  database-url: "postgres://REPLACE_ME:REPLACE_ME@REPLACE_ME:5432/atlas"

  # auth-service signing key. Must be at least 32 bytes — the service
  # refuses to start otherwise. Rotating it invalidates every live token,
  # so treat a rotation as a user-visible logout event.
  jwt-secret: "REPLACE_ME_WITH_AT_LEAST_32_BYTES_OF_RANDOM"
  # Names the active signing key. Any stable string; it appears in every
  # token's `kid` header and changes only during a rotation.
  jwt-key-id: "k1"
  # Only set while a rotation is in flight, as `kid:secret,kid:secret`.
  # Emptied again once every token signed with the old key has expired —
  # see the rotation table in the README.
  # jwt-retired-keys: "k0:PREVIOUS_SECRET"
